<section class="catalog-section" id="catalogo-productos">
  <div class="catalog-layout" [class.catalog-layout--without-cart]="!showCart">
    <div class="catalog-container">

    <!-- Secciones de productos agrupadas por categoría -->
    <article *ngFor="let cat of visibleCategories; let i = index" class="category-block">
      
      <!-- Encabezado de categoría -->
      <div class="category-header">
        <div class="category-info">
          <span class="section-label">{{ cat.tag }}</span>
          <h2 class="category-title">{{ cat.name }}</h2>
        </div>
      </div>

      <!-- Cuadrícula responsive de productos -->
      <div class="carousel-track" #slider>
        <div 
          *ngFor="let product of cat.products" 
          class="product-card" 
          [class.product-card--featured]="product.featured">
          
          <div class="card-media">
            <span *ngIf="product.badge" class="product-badge">{{ product.badge }}</span>
            <img [src]="product.image" [alt]="product.name" loading="lazy" />
          </div>

          <div class="card-body">
            <span class="product-sku">{{ product.sku }}</span>
            <h3 class="product-name">{{ product.name }}</h3>
            <p class="product-desc">{{ product.description }}</p>
            <a
              *ngIf="hasDetail(product); else noDetailLink"
              class="card-view-hint"
              [routerLink]="['/producto', getProductSlug(product)]"
            >
              Consultar producto
              <span aria-hidden="true">↗</span>
            </a>
            <ng-template #noDetailLink>
              <span class="card-view-hint">
                Consultar producto
                <span aria-hidden="true">↗</span>
              </span>
            </ng-template>
          </div>

          <div class="card-footer">
            <div class="price-wrap">
              <span class="currency">MXN</span>
              <span class="price">{{ product.price | currency:'USD':'symbol':'1.2-2' }}</span>
            </div>
            <button type="button" class="btn-action" (click)="addToCart(product)">
              Agregar
            </button>
          </div>

        </div>
      </div>

      </article>

    </div>
      <app-carrito-sidebar *ngIf="showCart" />
  </div>
</section>
